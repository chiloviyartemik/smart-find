<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
            <div class="burger">
            <span class="bspan"></span>
            <span class="bspan"></span>
            <span class="bspan"></span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="find.html">Подбор</a></li>
            </ul>
        </nav>
    <label class="theme-switch">
    <input type="checkbox" id="theme-checkbox">
    <span id="them" class="switch-icon"></span>
</label>

    </header>
    <main>
        <nav class="bnav">
            <ul>
                <li><a href="index.html" class="at">Главная</a></li>
                <li><a href="find.html" class="at">Подбор</a></li>
            </ul>
        </nav>
        <div class="bnavf">
            <label><input class="sortimp" type="radio" name="sort" id="DOWN">По убыванию</label>
            <label><input class="sortimp" type="radio" name="sort" id="UP">По возрастанию</label>

        </div>


    <div class="filtdiv">
    <button  id="allfilt">Убрать кнопки</button>
    <button class="filter">
<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://w3.org">
    <!-- Верхний ползунок (линия поднята на уровень Y=5) -->
    <path d="M2 5H8M26 5H12M8 2V8M12 2V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Средний ползунок (ровно по центру на уровне Y=14) -->
    <path d="M2 14H18M26 14H22M18 11V17M22 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Нижний ползунок (линия опущена на уровень Y=23) -->
    <path d="M2 23H10M26 23H14M10 20V26M14 20V26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>


    </button>
    </div>
    
    <div class="costdiv">
    <div class="range-values">
        <span id="min-price">10000₽</span> — <span id="max-price">100000₽</span>
    </div>
    <div class="range-container">
        <div class="slider-track"></div>
        <input type="range" class="cost min-range" min="10000" max="100000" value="10000" step="5000">
        <input type="range" class="cost max-range" min="10000" max="100000" value="100000" step="5000">
    </div>
</div>

    <div class="buttons">
    <select>
    <option value="">Основное использование</option> 
    <option value="balans">Баланс</option>
    <option value="autonomy">Автономность</option>
    <option value="camers">Камеры</option>
    <option value="game">Игры</option>
    <option value="gps">Навигатор</option>
    </select>

    
        <button class="filter-btn" data-tag="CN">CN версия</button>  
        <button class="filter-btn" data-tag="fastcharge">Fast Charge</button>
        <button class="filter-btn" data-tag="compact">Compact</button>
        <button class="filter-btn" data-tag="ip">IP</button>
        <button class="filter-btn" data-tag="material">Material</button>
        <button class="filter-btn" data-tag="scan">Scan</button>
        <button class="filter-btn" data-tag="esim">Esim</button>     
        <button class="filter-btn" data-tag="snap">Snap</button>
        <button class="filter-btn" data-tag="tp">TP</button>        



  
    </div>
    <h2 class="count"></h2>
    <div class="block1"></div>
    


    
    </main>
    <footer>
        <div class="findfoot"><p>Цены актуальны для маркетплейсов России в апреле 26 года</p></div>
    </footer>


</body>
<script type="module" src="find.js"></script>

</html>
